{% extends "base.html" %}
{% block title %}Evento — Venta de Entradas{% endblock %}
{% block content %}
<div id="eventDetail" class="mb-4"></div>

<div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">
        <h4 class="section-title mb-3">Elegí tus butacas</h4>
        <div class="seat-screen"></div>
        <div id="seatsList" class="text-center"></div>
        <div class="seat-legend">
            <span class="legend-free">Disponible</span>
            <span class="legend-occupied">Ocupado</span>
        </div>
    </div>
</div>
<div id="seatMsg" class="mt-3"></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/event.js?v={{ asset_version }}"></script>
{% endblock %}
