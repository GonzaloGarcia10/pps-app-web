<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Venta de Entradas{% endblock %}</title>
    <link rel="icon" href="/static/favicon.svg?v={{ asset_version }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🎟️ Entradas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1" id="navMenu">
                    <li class="nav-item"><a class="nav-link" href="/">Eventos</a></li>
                    <li class="nav-item d-none" id="adminNav"><a class="nav-link" href="/admin">Panel Admin</a></li>
                    <li class="nav-item d-none" id="ticketsNav"><a class="nav-link" href="/my-tickets">Mis Entradas</a></li>
                    <li class="nav-item" id="loginNav"><a class="nav-link" href="/login">Iniciar sesión</a></li>
                    <li class="nav-item" id="registerNav"><a class="btn btn-sm btn-warning fw-semibold ms-lg-2 rounded-pill px-3" href="/register">Crear cuenta</a></li>
                    <li class="nav-item d-none" id="userNav">
                        <span class="navbar-text text-white-50 small ms-lg-2">👤 <span id="userName"></span></span>
                    </li>
                    <li class="nav-item d-none" id="logoutNav">
                        <button class="btn btn-sm btn-outline-light ms-lg-2 rounded-pill px-3" onclick="logout()">Salir</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <div class="container d-flex flex-wrap justify-content-between align-items-center">
            <span>🎟️ Entradas — Venta de entradas de eventos</span>
            <span>Teatro · Cine · Conciertos · Deportes · <a href="/docs">API Docs</a></span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js?v={{ asset_version }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
