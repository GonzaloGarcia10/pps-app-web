{% extends "base.html" %}
{% block title %}Panel Admin{% endblock %}
{% block content %}
<h2 class="section-title">Panel de Administración</h2>
<div id="adminMsg" class="mt-3"></div>

<ul class="nav nav-tabs mt-3" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#venuesTab">🏛️ Recintos</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#eventsTab">🎭 Eventos</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#seatsTab">🪑 Butacas</button></li>
</ul>

<div class="tab-content border border-top-0 p-4">
    <div class="tab-pane fade show active" id="venuesTab">
        <h5 class="fw-bold mb-3">Nuevo recinto</h5>
        <form id="venueForm" class="row g-2 mb-4">
            <div class="col-md-3"><input class="form-control" id="v_name" placeholder="Nombre" required></div>
            <div class="col-md-3"><input class="form-control" id="v_address" placeholder="Dirección" required></div>
            <div class="col-md-2"><input class="form-control" id="v_city" placeholder="Ciudad" required></div>
            <div class="col-md-2"><input type="number" class="form-control" id="v_capacity" placeholder="Capacidad" required></div>
            <div class="col-md-2"><button class="btn btn-primary w-100">Crear</button></div>
        </form>
        <div id="venuesList"></div>
    </div>

    <div class="tab-pane fade" id="eventsTab">
        <h5 class="fw-bold mb-3">Nuevo evento</h5>
        <form id="eventForm" class="row g-2 mb-4">
            <div class="col-md-3"><input class="form-control" id="e_title" placeholder="Título" required></div>
            <div class="col-md-2">
                <select class="form-select" id="e_type">
                    <option value="cine">🎬 Cine</option>
                    <option value="teatro">🎭 Teatro</option>
                    <option value="concierto">🎵 Concierto</option>
                    <option value="deporte">🏆 Deporte</option>
                    <option value="congreso">💼 Congreso</option>
                    <option value="otro">🎟️ Otro</option>
                </select>
            </div>
            <div class="col-md-2"><input type="datetime-local" class="form-control" id="e_start" required></div>
            <div class="col-md-2"><select class="form-select" id="e_venue" required></select></div>
            <div class="col-md-1"><input type="number" step="0.01" class="form-control" id="e_price" placeholder="€" required></div>
            <div class="col-md-2"><button class="btn btn-primary w-100">Crear</button></div>
        </form>
        <div id="eventsList"></div>
    </div>

    <div class="tab-pane fade" id="seatsTab">
        <h5 class="fw-bold mb-3">Generar butacas por fila</h5>
        <form id="seatsForm" class="row g-2 mb-4">
            <div class="col-md-3"><select class="form-select" id="s_event" required></select></div>
            <div class="col-md-1"><input class="form-control" id="s_row" placeholder="Fila" required></div>
            <div class="col-md-2"><input type="number" class="form-control" id="s_from" placeholder="Desde" required></div>
            <div class="col-md-2"><input type="number" class="form-control" id="s_to" placeholder="Hasta" required></div>
            <div class="col-md-2"><input type="number" step="0.01" class="form-control" id="s_price" placeholder="Precio €" required></div>
            <div class="col-md-2"><button class="btn btn-primary w-100">Generar</button></div>
        </form>
        <div id="seatsAdminList"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/admin.js?v={{ asset_version }}"></script>
{% endblock %}
