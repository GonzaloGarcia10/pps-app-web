{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card auth-card">
            <div class="card-header"><h4>🎟️ Crear cuenta</h4></div>
            <div class="card-body p-4">
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" id="full_name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Registrarme</button>
                    <div class="text-center mt-3">
                        <span class="text-muted small">¿Ya tenés cuenta?</span>
                        <a href="/login" class="small fw-semibold">Iniciá sesión</a>
                    </div>
                </form>
                <div id="registerMsg" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/register.js?v={{ asset_version }}"></script>
{% endblock %}
